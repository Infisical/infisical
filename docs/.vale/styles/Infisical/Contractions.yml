extends: substitution
message: "Use '%s' instead of '%s'."
level: error
link: https://github.com/Infisical/infisical/blob/main/docs/STYLE_GUIDE.md#use-contractions
ignorecase: true
vocab: false
nonword: true
swap:

  '(?<!\b(?:in|on|at|around|inside|behind|within|under|underneath|above|below|beyond|from|with|for|by|near|through|alongside|beside)\s)\bit is\b(?! not)(?!\.)(?![,;)])(?!\s*$)': "it's"
  '\byou will\b(?! not)(?![,;)])(?!\s*$)': "you'll"
  '\byou are\b(?! not)(?![,;)])(?!\s*$)': "you're"
  '\bwe are\b(?! not)(?![,;)])(?!\s*$)': "we're"
  '\bthey are\b(?!\.)(?![,;)])(?!\s*$)': "they're"
  '\bcannot\b': "can't"
  '\bdo not\b': "don't"
  '\bdoes not\b': "doesn't"
  '\bdid not\b': "didn't"
  '\bis not\b': "isn't"
  '\bare not\b': "aren't"
  '\bwas not\b': "wasn't"
  '\bwere not\b': "weren't"
  '\bhas not\b': "hasn't"
  '\bhave not\b': "haven't"
  '\bwill not\b': "won't"
  '\bshould not\b': "shouldn't"
  '\bcould not\b': "couldn't"
  '\bwould not\b': "wouldn't"
