extends: conditional
message: "Every page needs a 'description' in its frontmatter."
level: error
link: https://github.com/Infisical/infisical/blob/main/docs/STYLE_GUIDE.md#page-structure
scope: raw
ignorecase: false
# Pages generated from the OpenAPI spec carry a title and an `openapi` route
# instead of prose, so the negative lookahead skips the whole file.
first: '(?sm)\A(?!.*^openapi:).*?^title:'
second: '(?m)^description:'
