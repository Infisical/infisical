extends: substitution
message: "Use '%s' instead of '%s'."
level: error
link: https://github.com/Infisical/infisical/blob/main/docs/STYLE_GUIDE.md#use-consistent-terminology
ignorecase: false
vocab: false
nonword: true
# Google's product is genuinely named "Secret Manager"; ours is plural. The
# lookbehinds cover an inline "GCP Secret Manager" mention on any page, and
# .vale.ini switches this rule off entirely on GCP and Google pages, where bare
# references to Google's service are the norm and appear in too many shapes
# to enumerate ("Secret Manager API", "Secret Manager Sync", "Secret Manager
# resources"). "Secret Manager API" is excluded everywhere: that is Google's API
# name, and Infisical has no product by that name. "AWS Secret Manager" is still
# caught -- AWS's is plural too.
swap:
  '(?<!GCP )(?<!Google )(?<!Google Cloud )\bSecret Manager\b(?! API)': Secrets Manager
  '\bSecret Management\b': Secrets Management
