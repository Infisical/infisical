  /api-go/v1/kms/keys:
    post:
      operationId: createKmsKey
      tags:
      - KMS Keys
      description: Create KMS key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: The ID of the project to create the key in.
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: The name of the key to be created. Must be slug-friendly.
                description:
                  type: string
                  maxLength: 500
                  description: An optional description of the key.
                keyUsage:
                  type: string
                  enum:
                  - encrypt-decrypt
                  - sign-verify
                  - generate-verify-mac
                  default: encrypt-decrypt
                  description: The type of key to be created, either encrypt-decrypt
                    or sign-verify, based on your intended use for the key.
                algorithm:
                  type: string
                  enum:
                  - aes-256-gcm
                  - aes-128-gcm
                  - RSA_4096
                  - ECC_NIST_P256
                  - ECC_NIST_P384
                  - ECC_NIST_P521
                  - ML_DSA_44
                  - ML_DSA_65
                  - ML_DSA_87
                  - HMAC_SHA_1
                  - HMAC_SHA_224
                  - HMAC_SHA_256
                  - HMAC_SHA_384
                  - HMAC_SHA_512
                  description: The cryptographic algorithm of the key (e.g. aes-256-gcm,
                    RSA_4096, HMAC_SHA_256).
                isExportable:
                  type: boolean
                  default: true
                  description: Whether the raw key material can be exported after
                    creation. When set to false, the key can never be exported regardless
                    of permissions. This cannot be changed after creation.
                hasDeleteProtection:
                  type: boolean
                  default: false
                  description: Prevents deletion of the key when enabled.
              required:
              - projectId
              - name
              additionalProperties: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      description:
                        type: string
                        nullable: true
                      isDisabled:
                        type: boolean
                        default: false
                        nullable: true
                      orgId:
                        type: string
                        format: uuid
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      projectId:
                        type: string
                        nullable: true
                      keyUsage:
                        type: string
                        default: encrypt-decrypt
                      kmipMetadata:
                        nullable: true
                      isExportable:
                        type: boolean
                        default: true
                      hasDeleteProtection:
                        type: boolean
                        default: false
                      version:
                        type: number
                        default: 1
                      algorithm:
                        type: string
                    required:
                    - id
                    - orgId
                    - name
                    - createdAt
                    - updatedAt
                    - algorithm
                    additionalProperties: false
                required:
                - key
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
