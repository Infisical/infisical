    get:
      operationId: listKmsKeys
      tags:
      - KMS Keys
      description: List KMS keys
      parameters:
      - schema:
          type: string
        in: query
        name: projectId
        required: true
        description: The ID of the project to list keys from.
      - schema:
          type: number
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
        description: The offset to start from. If you enter 10, it will start from
          the 10th key.
      - schema:
          type: number
          minimum: 1
          maximum: 100
          default: 100
        in: query
        name: limit
        required: false
        description: The number of keys to return.
      - schema:
          type: string
          enum:
          - name
          default: name
        in: query
        name: orderBy
        required: false
        description: The column to order keys by.
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: orderDirection
        required: false
        description: The direction to order keys in.
      - schema:
          type: string
        in: query
        name: search
        required: false
        description: The text string to filter key names by.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        description:
                          type: string
                          nullable: true
                        isDisabled:
                          type: boolean
                          default: false
                          nullable: true
                        orgId:
                          type: string
                          format: uuid
                        name:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        projectId:
                          type: string
                          nullable: true
                        keyUsage:
                          type: string
                          default: encrypt-decrypt
                        kmipMetadata:
                          nullable: true
                        isExportable:
                          type: boolean
                          default: true
                        hasDeleteProtection:
                          type: boolean
                          default: false
                        version:
                          type: number
                          default: 1
                        algorithm:
                          type: string
                      required:
                      - id
                      - orgId
                      - name
                      - createdAt
                      - updatedAt
                      - algorithm
                      additionalProperties: false
                  totalCount:
                    type: number
                required:
                - keys
