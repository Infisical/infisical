# Render Blueprint: Infisical (PR #9471, cloud behavior) with Postgres and Redis.
# Cloud: forces Infisical Cloud behavior, so every folder access grant (root included) needs secretsFolderRbac, like the free plan.
# Apply from the Render Dashboard (New > Blueprint), pick this repo and branch.
# No LICENSE_KEY is set, so the instance has no paid plan features
# (secretsFolderRbac is off).
#
# Env vars:
#   DB_CONNECTION_URI    Postgres internal connection string
#   REDIS_URL            Key Value internal connection string
#   ROOT_ENCRYPTION_KEY  generated 256-bit base64 key
#   AUTH_SECRET          generated 256-bit base64 key
#   SITE_URL             defaults to the service's onrender.com URL at start
databases:
  - name: infisical-cloud-db
    databaseName: infisical
    user: infisical
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: keyvalue
    name: infisical-cloud-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: infisical-cloud
    runtime: docker
    plan: standard
    region: oregon
    branch: eng-5961-folder-access-root-billing-render-cloud
    autoDeploy: false
    dockerfilePath: ./Dockerfile.standalone-infisical
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DB_CONNECTION_URI
        fromDatabase:
          name: infisical-cloud-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: infisical-cloud-redis
          type: keyvalue
          property: connectionString
      - key: ROOT_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: TELEMETRY_ENABLED
        value: "false"
