AWSTemplateFormatVersion: "2010-09-09"
Description: "Infisical AWS App Connection. Creates an IAM role that Infisical assumes, with no long-lived credentials."
Metadata:
  InfisicalTemplateVersion: "1"
  "cfn-lint":
    config:
      ignore_checks:
        - "W1030"
