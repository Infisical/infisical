Parameters:
  ExternalId:
    Type: "String"
    Description: "External ID Infisical sends when assuming the role: a Project ID or an Organization ID"
    AllowedPattern: "[\\w+=,.@:/-]{2,1224}"
    ConstraintDescription: "Enter the ID shown in Infisical"
  TrustedAccountId:
    Type: "String"
    Description: "ID of the AWS account whose principals are allowed to assume the role"
    AllowedPattern: "\\d{12}"
    ConstraintDescription: "Enter a 12-digit AWS account ID"
  RoleName:
    Type: "String"
    Default: "infisical-app-connection"
    Description: "Name of the IAM role to create"
    AllowedPattern: "[\\w+=,.@-]{1,64}"
    ConstraintDescription: "Use up to 64 letters, digits, and the characters +=,.@_-"
  EnableSecretsManager:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Secrets Manager sync"
  EnableSecretsManagerKms:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Also grant the extra permissions needed when AWS Secrets Manager sync uses a customer managed KMS key"
  EnableParameterStore:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Parameter Store sync"
  EnableParameterStoreKms:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Also grant the extra permissions needed when AWS Parameter Store sync uses a customer managed KMS key"
  EnableIamRotation:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS IAM user secret rotation"
  EnableHoneyTokens:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS honey tokens"
  EnableAcmSync:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Certificate Manager sync"
  EnableElbSync:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Elastic Load Balancer sync"
  EnablePkiSecretsManager:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Secrets Manager certificate sync"
  EnablePrivateCa:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Private CA"
  EnableAcmPublicCa:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for AWS Certificate Manager public CA"
  EnableAcmeRoute53:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for ACME CA with Route 53"
  EnablePamRecording:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for PAM session recording"
  EnableAgentVaultSessionLogs:
    Type: "String"
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Grant the permissions for Agent Vault session logs"
  PrivateCaArn:
    Type: "String"
    Default: ""
    Description: "ARN of the AWS Private CA that Infisical issues certificates from"
    AllowedPattern: "(arn:aws[\\w-]*:acm-pca:[\\w-]+:\\d{12}:certificate-authority/[\\w-]+)?"
  Route53HostedZoneId:
    Type: "String"
    Default: ""
    Description: "ID of the Route 53 hosted zone used for ACM validation or ACME challenges"
    AllowedPattern: "([A-Z0-9]{1,32})?"
  PamRecordingBucket:
    Type: "String"
    Default: ""
    Description: "Name of the S3 bucket PAM session recordings are written to"
    AllowedPattern: "([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?"
  AgentVaultSessionLogsBucket:
    Type: "String"
    Default: ""
    Description: "Name of the S3 bucket Agent Vault session logs are written to"
    AllowedPattern: "([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?"
  AgentVaultSessionLogsKeyPrefix:
    Type: "String"
    Default: ""
    Description: "Key prefix Agent Vault session logs are written under, without a trailing slash"
    AllowedPattern: "([\\w!.*()=+@,:;-]+(/[\\w!.*()=+@,:;-]+)*)?"
Rules:
  RequirePrivateCaArn:
    RuleCondition:
      "Fn::Equals":
        - Ref: "EnablePrivateCa"
        - "true"
    Assertions:
      - Assert:
          "Fn::Not":
            - "Fn::Equals":
                - Ref: "PrivateCaArn"
                - ""
        AssertDescription: "PrivateCaArn is required when a use case that needs it is enabled"
  RequireRoute53HostedZoneId:
    RuleCondition:
      "Fn::Or":
        - "Fn::Equals":
            - Ref: "EnableAcmPublicCa"
            - "true"
        - "Fn::Equals":
            - Ref: "EnableAcmeRoute53"
            - "true"
    Assertions:
      - Assert:
          "Fn::Not":
            - "Fn::Equals":
                - Ref: "Route53HostedZoneId"
                - ""
        AssertDescription: "Route53HostedZoneId is required when a use case that needs it is enabled"
  RequirePamRecordingBucket:
    RuleCondition:
      "Fn::Equals":
        - Ref: "EnablePamRecording"
        - "true"
    Assertions:
      - Assert:
          "Fn::Not":
            - "Fn::Equals":
                - Ref: "PamRecordingBucket"
                - ""
        AssertDescription: "PamRecordingBucket is required when a use case that needs it is enabled"
  RequireAgentVaultSessionLogsBucket:
    RuleCondition:
      "Fn::Equals":
        - Ref: "EnableAgentVaultSessionLogs"
        - "true"
    Assertions:
      - Assert:
          "Fn::Not":
            - "Fn::Equals":
                - Ref: "AgentVaultSessionLogsBucket"
                - ""
        AssertDescription: "AgentVaultSessionLogsBucket is required when a use case that needs it is enabled"
  RequireAgentVaultSessionLogsKeyPrefix:
    RuleCondition:
      "Fn::Equals":
        - Ref: "EnableAgentVaultSessionLogs"
        - "true"
    Assertions:
      - Assert:
          "Fn::Not":
            - "Fn::Equals":
                - Ref: "AgentVaultSessionLogsKeyPrefix"
                - ""
        AssertDescription: "AgentVaultSessionLogsKeyPrefix is required when a use case that needs it is enabled"
Conditions:
  UseSecretsManager:
    "Fn::Equals":
      - Ref: "EnableSecretsManager"
      - "true"
  UseSecretsManagerKms:
    "Fn::And":
      - Condition: "UseSecretsManager"
      - "Fn::Equals":
          - Ref: "EnableSecretsManagerKms"
          - "true"
  UseParameterStore:
    "Fn::Equals":
      - Ref: "EnableParameterStore"
      - "true"
  UseParameterStoreKms:
    "Fn::And":
      - Condition: "UseParameterStore"
      - "Fn::Equals":
          - Ref: "EnableParameterStoreKms"
          - "true"
  UseIamRotation:
    "Fn::Equals":
      - Ref: "EnableIamRotation"
      - "true"
  UseHoneyTokens:
    "Fn::Equals":
      - Ref: "EnableHoneyTokens"
      - "true"
  UseAcmSync:
    "Fn::Equals":
      - Ref: "EnableAcmSync"
      - "true"
  UseElbSync:
    "Fn::Equals":
      - Ref: "EnableElbSync"
      - "true"
  UsePkiSecretsManager:
    "Fn::Equals":
      - Ref: "EnablePkiSecretsManager"
      - "true"
  UsePrivateCa:
    "Fn::Equals":
      - Ref: "EnablePrivateCa"
      - "true"
  UseAcmPublicCa:
    "Fn::Equals":
      - Ref: "EnableAcmPublicCa"
      - "true"
  UseAcmeRoute53:
    "Fn::Equals":
      - Ref: "EnableAcmeRoute53"
      - "true"
  UsePamRecording:
    "Fn::Equals":
      - Ref: "EnablePamRecording"
      - "true"
  UseAgentVaultSessionLogs:
    "Fn::Equals":
      - Ref: "EnableAgentVaultSessionLogs"
      - "true"
Resources:
  Role:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName:
        Ref: "RoleName"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              AWS:
                "Fn::Sub": "arn:${AWS::Partition}:iam::${TrustedAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId":
                  Ref: "ExternalId"
  SecretsManagerPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseSecretsManager"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-secrets-manager"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowSecretsManagerAccess"
            Effect: "Allow"
            Action:
              - "secretsmanager:ListSecrets"
              - "secretsmanager:GetSecretValue"
              - "secretsmanager:BatchGetSecretValue"
              - "secretsmanager:CreateSecret"
              - "secretsmanager:UpdateSecret"
              - "secretsmanager:DeleteSecret"
              - "secretsmanager:DescribeSecret"
              - "secretsmanager:TagResource"
              - "secretsmanager:UntagResource"
            Resource: "*"
  SecretsManagerKmsPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseSecretsManagerKms"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-secrets-manager-kms"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowKmsKeyForSecretsManager"
            Effect: "Allow"
            Action:
              - "kms:ListAliases"
              - "kms:DescribeKey"
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:GenerateDataKey"
            Resource: "*"
  ParameterStorePolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseParameterStore"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-parameter-store"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowSSMAccess"
            Effect: "Allow"
            Action:
              - "ssm:PutParameter"
              - "ssm:GetParameters"
              - "ssm:GetParametersByPath"
              - "ssm:DescribeParameters"
              - "ssm:DeleteParameters"
              - "ssm:ListTagsForResource"
              - "ssm:AddTagsToResource"
              - "ssm:RemoveTagsFromResource"
            Resource: "*"
  ParameterStoreKmsPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseParameterStoreKms"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-parameter-store-kms"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowKmsKeyForParameterStore"
            Effect: "Allow"
            Action:
              - "kms:ListAliases"
              - "kms:DescribeKey"
              - "kms:Encrypt"
              - "kms:Decrypt"
            Resource: "*"
  IamRotationPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseIamRotation"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-iam-rotation"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowIamUserAccessKeyRotation"
            Effect: "Allow"
            Action:
              - "iam:ListAccessKeys"
              - "iam:CreateAccessKey"
              - "iam:UpdateAccessKey"
              - "iam:DeleteAccessKey"
              - "iam:ListUsers"
            Resource: "*"
  HoneyTokensPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseHoneyTokens"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-honey-tokens"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "HoneyTokenIAMManagement"
            Effect: "Allow"
            Action:
              - "iam:CreateUser"
              - "iam:DeleteUser"
              - "iam:CreateAccessKey"
              - "iam:DeleteAccessKey"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:iam::*:user/inf_ht_*"
          - Sid: "HoneyTokenStackVerification"
            Effect: "Allow"
            Action:
              - "cloudformation:DescribeStacks"
            Resource: "*"
  AcmSyncPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseAcmSync"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-acm-sync"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCertificateManagerAccess"
            Effect: "Allow"
            Action:
              - "acm:ListCertificates"
              - "acm:DescribeCertificate"
              - "acm:GetCertificate"
              - "acm:ImportCertificate"
              - "acm:ExportCertificate"
              - "acm:DeleteCertificate"
              - "acm:AddTagsToCertificate"
              - "acm:RemoveTagsFromCertificate"
              - "acm:ListTagsForCertificate"
            Resource: "*"
  ElbSyncPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseElbSync"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-elb-sync"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowElbCertificateManagerAccess"
            Effect: "Allow"
            Action:
              - "acm:ListCertificates"
              - "acm:DescribeCertificate"
              - "acm:GetCertificate"
              - "acm:ImportCertificate"
              - "acm:DeleteCertificate"
              - "acm:AddTagsToCertificate"
              - "acm:ListTagsForCertificate"
            Resource: "*"
          - Sid: "AllowElasticLoadBalancerAccess"
            Effect: "Allow"
            Action:
              - "elasticloadbalancing:DescribeLoadBalancers"
              - "elasticloadbalancing:DescribeListeners"
              - "elasticloadbalancing:DescribeListenerCertificates"
              - "elasticloadbalancing:AddListenerCertificates"
              - "elasticloadbalancing:RemoveListenerCertificates"
              - "elasticloadbalancing:ModifyListener"
            Resource: "*"
  PkiSecretsManagerPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UsePkiSecretsManager"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-pki-secrets-manager"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowSecretsManagerCertificateSync"
            Effect: "Allow"
            Action:
              - "secretsmanager:ListSecrets"
              - "secretsmanager:CreateSecret"
              - "secretsmanager:UpdateSecret"
              - "secretsmanager:DeleteSecret"
            Resource: "*"
  PrivateCaPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UsePrivateCa"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-private-ca"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowAwsPrivateCAAccess"
            Effect: "Allow"
            Action:
              - "acm-pca:DescribeCertificateAuthority"
              - "acm-pca:GetCertificateAuthorityCertificate"
              - "acm-pca:IssueCertificate"
              - "acm-pca:GetCertificate"
              - "acm-pca:RevokeCertificate"
            Resource:
              Ref: "PrivateCaArn"
  AcmPublicCaPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseAcmPublicCa"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-acm-public-ca"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowAcmPublicCaAccess"
            Effect: "Allow"
            Action:
              - "acm:RequestCertificate"
              - "acm:DescribeCertificate"
              - "acm:ExportCertificate"
              - "acm:RenewCertificate"
              - "acm:RevokeCertificate"
              - "acm:ListCertificates"
            Resource: "*"
          - Sid: "AllowRoute53ForAcmValidation"
            Effect: "Allow"
            Action:
              - "route53:GetHostedZone"
              - "route53:ChangeResourceRecordSets"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:route53:::hostedzone/${Route53HostedZoneId}"
  AcmeRoute53Policy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseAcmeRoute53"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-acme-route53"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowRoute53HostedZoneForAcme"
            Effect: "Allow"
            Action:
              - "route53:GetHostedZone"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:route53:::hostedzone/${Route53HostedZoneId}"
          - Sid: "AllowRoute53TxtRecordsForAcme"
            Effect: "Allow"
            Action:
              - "route53:ChangeResourceRecordSets"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:route53:::hostedzone/${Route53HostedZoneId}"
            Condition:
              "ForAllValues:StringEquals":
                "route53:ChangeResourceRecordSetsRecordTypes":
                  - "TXT"
  PamRecordingPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UsePamRecording"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-pam-recording"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowPamRecordingBucketAccess"
            Effect: "Allow"
            Action:
              - "s3:PutObject"
              - "s3:GetObject"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:s3:::${PamRecordingBucket}/*"
          - Sid: "AllowPamRecordingBucketTest"
            Effect: "Allow"
            Action:
              - "s3:ListBucket"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:s3:::${PamRecordingBucket}"
          - Sid: "AllowPamRecordingConnectionTestCleanup"
            Effect: "Allow"
            Action:
              - "s3:DeleteObject"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:s3:::${PamRecordingBucket}/.test/*"
  AgentVaultSessionLogsPolicy:
    Type: "AWS::IAM::RolePolicy"
    Condition: "UseAgentVaultSessionLogs"
    Properties:
      RoleName:
        Ref: "Role"
      PolicyName: "infisical-agent-vault-session-logs"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowAgentVaultSessionLogObjects"
            Effect: "Allow"
            Action:
              - "s3:PutObject"
              - "s3:GetObject"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:s3:::${AgentVaultSessionLogsBucket}/${AgentVaultSessionLogsKeyPrefix}/*"
          - Sid: "AllowAgentVaultSessionLogBucket"
            Effect: "Allow"
            Action:
              - "s3:ListBucket"
            Resource:
              "Fn::Sub": "arn:${AWS::Partition}:s3:::${AgentVaultSessionLogsBucket}"
            Condition:
              StringLike:
                "s3:prefix":
                  "Fn::Sub": "${AgentVaultSessionLogsKeyPrefix}/*"
Outputs:
  RoleArn:
    Description: "Paste this value into the Role ARN field in Infisical"
    Value:
      "Fn::GetAtt":
        - "Role"
        - "Arn"
