        default: "AWS Secrets Manager sync: uses a customer managed KMS key"
      EnableParameterStore:
        default: "AWS Parameter Store sync"
      EnableParameterStoreKms:
        default: "AWS Parameter Store sync: uses a customer managed KMS key"
      EnableIamRotation:
        default: "AWS IAM user secret rotation"
      EnableHoneyTokens:
        default: "AWS honey tokens"
      EnableAcmSync:
        default: "AWS Certificate Manager sync"
      EnableElbSync:
        default: "AWS Elastic Load Balancer sync"
      EnablePkiSecretsManager:
        default: "AWS Secrets Manager certificate sync"
      EnablePrivateCa:
