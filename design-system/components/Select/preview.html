<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

var envs = [
  { value: 'development', label: 'Development' }, { value: 'staging', label: 'Staging' }, { value: 'production', label: 'Production' },
  { value: 'pr-482', label: 'pr-482', description: 'Expires Oct 1', group: 'Preview' }, { value: 'pr-490', label: 'pr-490', description: 'Expired', group: 'Preview', disabled: true },
];
function Demo() {
  function cell(t, node) { return h('div', { className: 'ifs-stack', style: { gap: 6 } }, cap(t), node); }
  // one per row; an open list gets its own room so it never covers the next example
  return h('div', { className: 'ifs-stack', style: { gap: 18, maxWidth: 440 } },
    h('div', { style: { paddingBottom: 226 } }, cell('Open', h(I.Select, { defaultOpen: true, defaultValue: 'production', options: envs, 'aria-label': 'Environment' }))),
    cell('Placeholder', h(I.Select, { options: envs, placeholder: 'Choose an environment', 'aria-label': 'Environment' })),
    cell('Disabled', h(I.Select, { options: envs, defaultValue: 'staging', disabled: true, 'aria-label': 'Environment' })),
    cell('Stacked label', h(I.Select, { label: 'Environment', options: envs, defaultValue: 'production' })),
    cell('Small', h(I.Select, { size: 'sm', options: [{ value: '25', label: '25' }, { value: '50', label: '50' }], defaultValue: '25', style: { width: 76 }, 'aria-label': 'Rows per page' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
