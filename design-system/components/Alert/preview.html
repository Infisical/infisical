<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

function Demo() {
  var B = I.Button;
  function k(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 12.5 } }, t); }
  var s = React.useState(true), info = s[0], setInfo = s[1];
  return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 16 } },
    info ? h(I.Alert, { title: 'Syncing is paused for staging', actions: h(B, { size: 'sm', onClick: function () { setInfo(false); } }, 'Resume sync'), onDismiss: function () { setInfo(false); } }, '14 changed secrets are waiting to go to GitHub Actions.')
      : h(I.Alert, { tone: 'ok', title: 'Syncing resumed' }, '14 secrets are on their way to GitHub Actions.'),
    h(I.Alert, { tone: 'ok', title: 'Rotation complete' }, k('redis_password'), ' v8 is live in all 3 environments. The old value is revoked.'),
    h(I.Alert, { tone: 'warn', title: '2 certificates expire this month', actions: h(B, { size: 'sm' }, 'Turn on auto-renew') }, k('vault.internal'), ' expires in 12 days and auto-renew is off.'),
    h(I.Alert, { tone: 'bad', title: 'Sync to Vercel failed', actions: [h(B, { key: 1, size: 'sm' }, 'Reconnect Vercel'), h(B, { key: 2, size: 'sm', variant: 'link' }, 'View sync log')] }, 'The Vercel token expired on Sep 23. Reconnect to resume syncing.'),
    h('div', { style: { gridColumn: '1 / -1' } }, h(I.Banner, { action: h('a', { href: '#' }, 'View policy'), onDismiss: function () {} }, 'You are working in ', h('code', null, 'production'), '. Changes need approval from prod-changes.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
