<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

function Demo() {
  var B = I.Badge;
  function row(t, kids) { return h('div', { className: 'ifs-row', style: { gap: 16 } }, h('span', { style: { width: 88 } }, cap(t)), h('div', { className: 'ifs-row', style: { gap: 8 } }, kids)); }
  return h('div', { className: 'ifs-stack', style: { gap: 14 } },
    row('Identity', [h(B, { key: 1 }, 'Machine'), h(B, { key: 2 }, 'Person'), h(B, { key: 3 }, 'Agent'), h(B, { key: 4, tone: 'soft' }, 'Rotating'), h(B, { key: 5, tone: 'soft' }, 'Dynamic')]),
    row('Status', [h(B, { key: 1, tone: 'ok', dot: true }, 'Synced'), h(B, { key: 2, tone: 'warn', dot: true }, 'Expiring'), h(B, { key: 3, tone: 'bad', dot: true }, 'Blocked'), h(B, { key: 4, tone: 'info', dot: true }, 'Pending'), h(B, { key: 5, tone: 'ok', size: 'sm' }, 'Synced')]),
    row('Emphasis', [h(B, { key: 1, tone: 'accent' }, 'New'), h(B, { key: 2, tone: 'solid' }, 'Required'), h(I.Count, { key: 3 }, '4'), h(I.Count, { key: 4, tone: 'ink' }, '12')]),
    row('Environment', [h(B, { key: 1, mono: true, size: 'sm' }, 'dev'), h(B, { key: 2, mono: true, size: 'sm' }, 'staging'), h(B, { key: 3, mono: true, size: 'sm', tone: 'solid' }, 'prod'), h(B, { key: 4, mono: true, size: 'sm', tone: 'soft' }, 'v15')]));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
