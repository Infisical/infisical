<!-- @dsCard group="Data display" height=460 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Separator</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 12.5 } }, t); }
function muted(t) { return h('span', { style: { fontSize: 13, color: 'var(--muted)', whiteSpace: 'nowrap', fontVariantNumeric: 'tabular-nums' } }, t); }
function line(left, right) { return h('div', { className: 'ifs-row', style: { justifyContent: 'space-between', gap: 12, flexWrap: 'nowrap', minHeight: 20 } }, left, right); }

// one example per row, each under its own caption
function Demo() {
  var B = I.Button;
  function cell(t, node) { return h('div', { className: 'ifs-stack', style: { gap: 10 } }, cap(t), node); }
  return h('div', { className: 'ifs-stack', style: { gap: 24, maxWidth: 440 } },
    cell('Between sections',
      h('div', { className: 'ifs-stack', style: { gap: 12 } },
        line(h('span', { style: { fontSize: 13.5, fontWeight: 600 } }, 'Production'), muted('412 secrets')),
        h(I.Separator),
        line(h('span', { style: { fontSize: 13.5, fontWeight: 600 } }, 'Staging'), muted('402 secrets')))),
    cell('Soft, between rows inside a surface',
      h('div', { className: 'ifs-stack', style: { gap: 8 } },
        line(mono('redis_password'), muted('Tomorrow')),
        h(I.Separator, { soft: true }),
        line(mono('session_signing_key'), muted('Sep 27')))),
    cell('With a label, for a break in time', h(I.Separator, { label: 'Earlier this week' })),
    cell('With a centered label', h(I.Separator, { label: 'or', align: 'center' })),
    cell('Vertical, between groups in a toolbar',
      h('div', null, h(I.ButtonGroup, { variant: 'toolbar', label: 'Value tools' },
        h(B, { variant: 'ghost', size: 'sm', icon: 'copy', iconOnly: true, 'aria-label': 'Copy value' }),
        h(B, { variant: 'ghost', size: 'sm', icon: 'eye', iconOnly: true, 'aria-label': 'Reveal value' }),
        h(I.Separator, { orientation: 'vertical' }),
        h(B, { variant: 'ghost', size: 'sm', icon: 'trash', iconOnly: true, 'aria-label': 'Delete secret' })))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
