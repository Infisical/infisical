<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EmptyState</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

function Demo() {
  var B = I.Button;
  return h('div', { className: 'ifs-stack', style: { gap: 20, maxWidth: 620 } },
    h('div', { className: 'ifs-stack', style: { gap: 8 } }, cap('First use'),
      h(I.Card, { flush: true }, h(I.EmptyState, { icon: 'key', title: 'No secrets in staging yet', description: 'Add one, or copy them from development in one step. Syncs pick them up on the next push.',
        actions: [h(B, { key: 1, variant: 'primary', icon: 'plus' }, 'Add secret'), h(B, { key: 2, icon: 'upload' }, 'Import from .env')] }))),
    h('div', { className: 'ifs-stack', style: { gap: 8 } }, cap('No results'),
      h(I.Card, { flush: true }, h(I.EmptyState, { variant: 'compact', title: 'No secrets match \u201cstripe_web\u201d.', actions: h(B, { variant: 'link', size: 'sm' }, 'Clear filter') }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
