<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AnimatedCollapse</title>
<style>

  .demo-disclose[aria-expanded="true"] .ifs-icon { transform: rotate(90deg); }

  .demo-acc:hover { background: color-mix(in srgb, currentColor var(--hover), transparent); }
  .demo-acc:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .demo-acc .ifs-icon { color: var(--muted); transition: transform var(--ifs-slide); }
  .demo-acc[aria-expanded="true"] .ifs-icon { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .demo-acc .ifs-icon, .demo-disclose .ifs-icon { transition: none; } }
</style>
</head>

<div id="root" class="ifs-demo"></div>

    h('div', { className: 'ifs-stack', style: { gap: 10 } }, cap('A setting that reveals its options'),
      h(I.Card, { variant: 'plain' }, h('div', null,

      })))));

</html>
