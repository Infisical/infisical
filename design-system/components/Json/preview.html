function cell(t, node) { return h('div', { className: 'ifs-stack', style: { gap: 8, minWidth: 0 } }, cap(t), node); }

var event = {
  id: 'evt_8f2c41', event: 'secret.updated', createdAt: '2026-09-24T10:30:12Z',

  project: 'acme-platform', environment: 'prod',
  secret: { key: 'STRIPE_WEBHOOK_SECRET', path: '/payments', version: 15, value: 'whsec_demo_9f2Kd8Qa7Lm', tags: ['payments', 'rotating'] },
  approval: { policy: 'prod-changes', required: 1, approvedBy: ['James Okoro'] },
  ip: '203.0.113.24', userAgent: 'infisical-cli/0.31.1',

var sync = { integration: 'vercel', project: 'acme-web', targets: ['production', 'preview'], secrets: 14, lastSync: { at: '2026-09-24T10:30:00Z', ok: true, durationMs: 812 }, retries: null };
function Demo() {

  var all = depth > 2;

ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
