<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MultiSelect</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function cell(t, node) { return h('div', { className: 'ifs-stack', style: { gap: 6, minWidth: 0 } }, cap(t), node); }

var envs = [
  { value: 'development', label: 'Development', description: '138 secrets' }, { value: 'staging', label: 'Staging', description: '402 secrets' },
  { value: 'production', label: 'Production', description: '412 secrets' }, { value: 'qa', label: 'QA sandbox', description: '51 secrets' },
  { value: 'pr-482', label: 'pr-482', description: 'Expires Oct 1', group: 'Preview' }, { value: 'pr-490', label: 'pr-490', description: 'Expired', group: 'Preview', disabled: true },
];
var core = envs.slice(0, 3);
var slug = { development: 'dev', staging: 'staging', production: 'prod', qa: 'qa' };
function Demo() {
  var f = React.useState(['production']), filter = f[0], setFilter = f[1];
  var trig = h(I.Button, { size: 'sm', icon: 'globe', iconRight: 'chev-down' }, 'Environment', filter.length ? h('span', { style: { display: 'inline-flex', marginLeft: 6 } }, h(I.Count, { tone: 'ink', 'aria-label': filter.length + ' selected' }, filter.length)) : null);
  return h('div', { className: 'ifs-stack', style: { gap: 18, maxWidth: 440 } },
    h('div', { style: { paddingBottom: 288 } }, cell('Several at once, with quick actions', h(I.MultiSelect, { defaultOpen: true, options: envs, defaultValue: ['staging', 'production'], placeholder: 'Choose environments', 'aria-label': 'Sync to environments' }))),
    h(React.Fragment, null,
      cell('Everything on, with an allLabel', h(I.MultiSelect, { options: core, defaultValue: ['development', 'staging', 'production'], allLabel: 'All environments', 'aria-label': 'Environments' })),
      cell('One at a time, clearable', h(I.MultiSelect, { multiple: false, clearable: true, options: core, placeholder: 'Any environment', 'aria-label': 'Environment' })),
      cell('Your own summary, under a stacked label', h(I.MultiSelect, { label: 'Environments', options: envs.slice(0, 4), defaultValue: ['development', 'production'],
        renderValue: function (vals) { return h('span', { className: 'ifs-row', style: { gap: 4, flexWrap: 'nowrap', overflow: 'hidden' } }, vals.map(function (v) { return h(I.Badge, { key: v, size: 'sm', mono: true, tone: 'soft' }, slug[v]); })); } })),
      cell('Your own trigger, in a toolbar', h('div', { className: 'ifs-row', style: { gap: 8 } },
        h(I.MultiSelect, { trigger: trig, options: core, value: filter, onChange: setFilter, 'aria-label': 'Filter by environment', menuWidth: 240 }),
        h('span', { style: { fontSize: 13, color: 'var(--muted)' } }, filter.length ? 'Showing ' + filter.map(function (v) { return slug[v]; }).join(', ') : 'Showing every environment')))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
