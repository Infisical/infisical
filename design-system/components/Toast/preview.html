<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

var START = [
  { id: 1, tone: 'ok', title: 'Secret saved', description: 'Syncing to Vercel and GitHub Actions.', action: 'Undo' },
  { id: 2, tone: 'ok', title: 'Rotation complete', description: 'redis_password v8 is live.' },
  { id: 3, tone: 'bad', title: 'Sync to Vercel failed', description: 'The token expired. Reconnect to retry.', action: 'Retry' },
  { id: 4, loading: true, title: 'Syncing 14 secrets' },
];
function Demo() {
  var s = React.useState(START), list = s[0], setList = s[1];
  var n = React.useRef(5);
  function drop(id) { setList(list.filter(function (t) { return t.id !== id; })); }
  function add() { n.current += 1; setList(list.concat([{ id: n.current, tone: 'ok', title: 'Secret saved', description: 'stripe_api_key v16 is live in production.', action: 'Undo' }])); }
  return h('div', { className: 'ifs-row', style: { alignItems: 'flex-start', gap: 32 } },
    h(I.ToastStack, { inline: true }, list.map(function (t) {
      return h(I.Toast, { key: t.id, tone: t.tone, loading: t.loading, title: t.title, description: t.description, action: t.action ? { label: t.action, onClick: function () { drop(t.id); } } : undefined, onDismiss: t.loading ? undefined : function () { drop(t.id); } });
    })),
    h('div', { className: 'ifs-stack', style: { gap: 8 } }, cap('Try it'), h(I.Button, { variant: 'primary', onClick: add }, 'Save secret'), h(I.Button, { onClick: function () { setList(START); } }, 'Reset')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
