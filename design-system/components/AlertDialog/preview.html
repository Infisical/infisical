<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AlertDialog</title></head>
<body>
<div id="root" class="ifs-demo"></div>
<script>
var I = window.Infisical, h = React.createElement;
function cap(t) { return h('span', { style: { fontSize: 12, lineHeight: '16px', fontWeight: 500, color: 'var(--muted)' } }, t); }
function mono(t) { return h('span', { className: 'ifs-mono', style: { fontSize: 13 } }, t); }

function Demo() {
  var s = React.useState(true), open = s[0], setOpen = s[1];
  return h('div', { style: { minHeight: 420 } }, h(I.Button, { variant: 'danger-ghost', icon: 'trash', onClick: function () { setOpen(true); } }, 'Delete secret'),
    h(I.AlertDialog, { open: open, onOpenChange: setOpen, title: ['Delete ', h('span', { key: 'k', className: 'ifs-mono' }, 'stripe_api_key'), '?'],
      description: 'This removes the secret from production and stops syncing it to Vercel and GitHub Actions. You can restore it from history for 30 days.',
      confirmText: 'stripe_api_key', confirmLabel: 'Delete secret' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
