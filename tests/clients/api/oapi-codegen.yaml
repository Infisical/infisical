# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: clients/api/api.gen.go

generate:
  models: true
  client: true

compatibility:
  # Otherwise an enum constant is prefixed with its type only when another constant
  # collides with it, so adding or removing an operation can rename constants elsewhere.
  always-prefix-enum-values: true

output-options:
  overlay:
    path: clients/api/overlay.yaml
  # The per-operation client is generated from our own templates, against the
  # hand-written runtime.go. See the comment at the top of each template.
  user-templates:
    client.tmpl: clients/api/templates/client.tmpl
    client-with-responses.tmpl: clients/api/templates/client-with-responses.tmpl
  # Valid() on every enum type; nothing in the suite calls it.
  skip-enum-validate: true
  # Only what the suite calls. Add an id here when a test reaches for a new endpoint.
  #
  # The route must also be in the spec, which needs OPENAPI_FULL_SPEC *and* a
  # non-production NODE_ENV on the instance being generated from -- env.ts resolves
  # isOpenApiFullSpec as `NODE_ENV !== "production" && OPENAPI_FULL_SPEC`, so the
  # harness's own container can never serve it. Generate from the dev stack. Half the
  # routes are hidden by default, and a route with no operationId gets a name derived
  # from its path that changes when the path does.
  include-operation-ids:
    - adminBootstrap
    - updateAdminConfig
    - getInstanceStatus
    - loginV3
    - selectOrganizationV3
    - refreshAuthToken
    - createOrganization
    - deleteOrganization
