  - target: $.paths['/api/v1/dashboard/accessible-secrets'].get.parameters[?(@.name == 'recursive')].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/dashboard/accessible-secrets'].get.parameters[?(@.name == 'recursive')].schema
    update:
