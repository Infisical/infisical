  # Each access request permission is [action, subject, conditions]; the spec types every
  # element as a string, so the conditions object could not be sent.
  - target: $.paths['/api/v1/access-approvals/requests'].post.requestBody.content['application/json'].schema.properties.permissions.items.items
    remove: true
  - target: $.paths['/api/v1/access-approvals/requests'].post.requestBody.content['application/json'].schema.properties.permissions.items
    update:
      items: {}
