  - target: $.paths['/api/v1/dashboard/secrets-details'].get.parameters[?(@.name == 'includeSecretRotations')].schema
    update:
      type: boolean
  - target: $.paths['/api/v1/dashboard/secrets-details'].get.parameters[?(@.name == 'includeHoneyTokens')].schema.anyOf
