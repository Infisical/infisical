overlay: 1.0.0
info:
  title: Generated client spec fixes
  version: 1.0.0
actions:
  - target: $.paths['/api/v2/workspace/{projectId}/roles'].post.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v2/workspace/{projectId}/roles'].post.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # Comma-separated query values that the server splits into a list. The allOf of a
  # string and an array cannot be merged into one Go type, so send them as the string
  # the server parses.
  - target: $.paths['/api/v1/organization/audit-logs'].get.parameters[?(@.name == 'eventType' || @.name == 'eventClass')].schema.allOf
    remove: true
  - target: $.paths['/api/v1/organization/audit-logs'].get.parameters[?(@.name == 'eventType' || @.name == 'eventClass')].schema
    update:
      type: string
  - target: $.paths['/api/v2/users/me'].delete.parameters[?(@.name == 'lastMemberOrganizationIds')].schema.allOf
    remove: true
  - target: $.paths['/api/v2/users/me'].delete.parameters[?(@.name == 'lastMemberOrganizationIds')].schema
    update:
      type: string
  # The same permission-action naming bug as createProjectRole above, in every other body
  # that carries project permission rules. The suite sends rules as JSON
  # (fixture.Permission).
  # createProjectRoleV1
  - target: $.paths['/api/v1/projects/{projectId}/roles'].post.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/projects/{projectId}/roles'].post.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateProjectRoleV1
  - target: $.paths['/api/v1/projects/{projectId}/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/projects/{projectId}/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # createUserProjectAdditionalPrivilege
  - target: $.paths['/api/v1/user-project-additional-privilege'].post.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/user-project-additional-privilege'].post.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateUserProjectAdditionalPrivilege
  - target: $.paths['/api/v1/user-project-additional-privilege/{privilegeId}'].patch.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/user-project-additional-privilege/{privilegeId}'].patch.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # createProjectTemplate
  - target: $.paths['/api/v1/project-templates'].post.requestBody.content['application/json'].schema.properties.roles.items.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/project-templates'].post.requestBody.content['application/json'].schema.properties.roles.items.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateProjectTemplate
  - target: $.paths['/api/v1/project-templates/{templateId}'].patch.requestBody.content['application/json'].schema.properties.roles.items.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/project-templates/{templateId}'].patch.requestBody.content['application/json'].schema.properties.roles.items.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateProjectRole
  - target: $.paths['/api/v2/workspace/{projectId}/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v2/workspace/{projectId}/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # createIdentityProjectAdditionalPrivilege
  - target: $.paths['/api/v2/identity-project-additional-privilege'].post.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v2/identity-project-additional-privilege'].post.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateIdentityProjectAdditionalPrivilege
  - target: $.paths['/api/v2/identity-project-additional-privilege/{id}'].patch.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v2/identity-project-additional-privilege/{id}'].patch.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # Boolean query flags the server also accepts as "true"/"false" strings. The anyOf
  # generates a union with no exported setter, so a test could not set the flag at all.
  - target: $.paths['/api/v1/pit/commits/{commitId}/compare'].get.parameters[?(@.name == 'deepRollback')].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/pit/commits/{commitId}/compare'].get.parameters[?(@.name == 'deepRollback')].schema
    update:
      type: boolean
  - target: $.paths['/api/v1/projects/{projectId}/memberships/{membershipId}/permissions/audit'].get.parameters[?(@.name == 'includeFolderPermissions')].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/projects/{projectId}/memberships/{membershipId}/permissions/audit'].get.parameters[?(@.name == 'includeFolderPermissions')].schema
    update:
      type: boolean
  - target: $.paths['/api/v1/dashboard/secrets-by-keys'].get.parameters[?(@.name == 'viewSecretValue')].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/dashboard/secrets-by-keys'].get.parameters[?(@.name == 'viewSecretValue')].schema
    update:
      type: boolean
  - target: $.paths['/api/v1/dashboard/secrets-by-keys'].get.parameters[?(@.name == 'hideUnreadableValues')].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/dashboard/secrets-by-keys'].get.parameters[?(@.name == 'hideUnreadableValues')].schema
    update:
      type: boolean
  - target: $.paths['/api/v2/folders'].get.parameters[?(@.name == 'recursive')].schema.anyOf
    remove: true
  - target: $.paths['/api/v2/folders'].get.parameters[?(@.name == 'recursive')].schema
    update:
      type: boolean
  # Each access request permission is [action, subject, conditions]; the spec types every
  # element as a string, so the conditions object could not be sent.
  - target: $.paths['/api/v1/access-approvals/requests'].post.requestBody.content['application/json'].schema.properties.permissions.items.items
    remove: true
  - target: $.paths['/api/v1/access-approvals/requests'].post.requestBody.content['application/json'].schema.properties.permissions.items
    update:
      items: {}
  # The same permission-action naming bug in organization role bodies.
  # createOrganizationRole
  - target: $.paths['/api/v1/organization/roles'].post.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/organization/roles'].post.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # updateOrganizationRole
  - target: $.paths['/api/v1/organization/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions.items
    remove: true
  - target: $.paths['/api/v1/organization/roles/{roleId}'].patch.requestBody.content['application/json'].schema.properties.permissions
    update:
      items:
        type: object
        additionalProperties: true
  # Every approval policy type registers the same generic routes under the same
  # operationIds, so only one type's can be generated. Name the certificate request
  # ones apart, and the code signing ones the suite calls.
  - target: $.paths['/api/v1/approval-policies/cert-request'].post
    update:
      operationId: createCertRequestApprovalPolicy
  - target: $.paths['/api/v1/approval-policies/cert-request/requests'].get
    update:
      operationId: listCertRequestApprovalRequests
  - target: $.paths['/api/v1/approval-policies/cert-request/requests/{requestId}/approve'].post
    update:
      operationId: approveCertRequestApprovalRequest
  - target: $.paths['/api/v1/approval-policies/cert-request/requests/{requestId}/reject'].post
    update:
      operationId: rejectCertRequestApprovalRequest
  - target: $.paths['/api/v1/approval-policies/cert-request'].get
    update:
      operationId: listCertRequestApprovalPolicies
  - target: $.paths['/api/v1/approval-policies/cert-request/{policyId}'].get
    update:
      operationId: getCertRequestApprovalPolicy
  - target: $.paths['/api/v1/approval-policies/cert-request/{policyId}'].patch
    update:
      operationId: updateCertRequestApprovalPolicy
  - target: $.paths['/api/v1/approval-policies/cert-request/{policyId}'].delete
    update:
      operationId: deleteCertRequestApprovalPolicy
  - target: $.paths['/api/v1/approval-policies/cert-request/requests/{requestId}/break-glass'].post
    update:
      operationId: breakGlassCertRequestApprovalRequest
  - target: $.paths['/api/v1/approval-policies/cert-request/requests/{requestId}'].get
    update:
      operationId: getCertRequestApprovalRequest
  - target: $.paths['/api/v1/approval-policies/cert-request/requests/{requestId}/cancel'].post
    update:
      operationId: cancelCertRequestApprovalRequest
  - target: $.paths['/api/v1/approval-policies/cert-code-signing/requests/{requestId}/approve'].post
    update:
      operationId: approveCertCodeSigningApprovalRequest
  - target: $.paths['/api/v1/cert-manager/certificates/certificate-requests'].get.parameters[?(@.name == 'profileIds')].schema.allOf
    remove: true
  - target: $.paths['/api/v1/cert-manager/certificates/certificate-requests'].get.parameters[?(@.name == 'profileIds')].schema
    update:
      type: string
  # An optional body is an anyOf of nothing and the object. The union it generates is sent
  # as {} unless filled through its From method, which drops removalOptions.
  - target: $.paths['/api/v1/cert-manager/syncs/palo-alto-networks-ssl-tls-profile/{pkiSyncId}/remove-certificates'].post.requestBody.content['application/json'].schema.anyOf
    remove: true
  - target: $.paths['/api/v1/cert-manager/syncs/palo-alto-networks-ssl-tls-profile/{pkiSyncId}/remove-certificates'].post.requestBody.content['application/json'].schema
    update:
      type: object
      properties:
        removalOptions:
          type: object
          properties:
            replacementCertificateName:
              type: string
  # crlNumber is Unix seconds plus a counter, past float32's precision, so neighbouring
  # numbers would decode to the same value.
  - target: $.paths['/api/v1/cert-manager/ca/internal/{caId}/crls/regenerate'].post.responses['200'].content['application/json'].schema.properties.crl.properties.crlNumber
    update:
      x-go-type: int64
