  - target: $.paths['/api/v1/dashboard/secrets-details'].get.parameters[?(@.name == 'includeHoneyTokens')].schema
    update:
      type: boolean
  - target: $.paths['/api/v1/dashboard/secrets-details'].get.parameters[?(@.name == 'includeProxiedServices')].schema.anyOf
