impactLevel: medium
summary: Agent Vault session logs in default storage need a license, proxied
  service creation and re-importing deleted certificates are blocked, and AWS
  IRSA temporary credentials need KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN.
  The certificates migration can fail on lock timeouts.
requiresDbMigration: true
breakingChanges:
  - title: Agent Vault session logs license
    description: Session logs in default storage (OBJECT_STORAGE_S3_*) now need a
      license that includes them, and existing licenses may not. Without one,
      instances stop recording them there and can't show existing ones, while
      external storage is unaffected.
    action: If you store session logs in default storage, confirm before upgrading
      that your license includes them, and replace offline license keys that
      don't.
    confidence: high
    evidence:
      - type: pr
        ref: "#8990"
        url: https://github.com/Infisical/infisical/pull/8990
        description: Self-hosted session logs now need a license
      - type: file
        ref: backend/src/ee/services/license/license-fns.ts
        path: backend/src/ee/services/license/license-fns.ts
        description: agentVaultManagedStorage now defaults to false
      - type: file
        ref: docs/self-hosting/guides/session-log-storage.mdx
        path: docs/self-hosting/guides/session-log-storage.mdx
        description: Self-hosting guide changed for session log storage
  - title: Proxied service creation disabled
    description: Creating a proxied service, including through POST
      /api/v1/proxied-services, now returns a 400 error as Agent Proxy moves to
      Agent Vault. Existing proxied services keep working and can still be edited
      or deleted.
    action: Move any automation that creates proxied services to Agent Vault before
      upgrading.
    confidence: high
    evidence:
      - type: file
        ref: backend/src/ee/services/proxied-service/proxied-service-service.ts
        path: backend/src/ee/services/proxied-service/proxied-service-service.ts
        description: create now always throws BadRequestError
      - type: pr
        ref: "#9070"
        url: https://github.com/Infisical/infisical/pull/9070
        description: Disable creation of proxied services
  - title: AWS IAM dynamic secret IRSA setting
    description: AWS IAM dynamic secrets that use IRSA with the temporary
      credentials type now require KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN,
      as the IAM user type already did. With the default of false, creating,
      updating and leasing them fails.
    action: If you use these dynamic secrets, set
      KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN=true before upgrading, or move
      them to another authentication method.
    confidence: high
    evidence:
      - type: file
        ref: backend/src/ee/services/dynamic-secret/providers/aws-iam.ts
        path: backend/src/ee/services/dynamic-secret/providers/aws-iam.ts
        description: assertIrsaEnabled on every IRSA branch
      - type: pr
        ref: "#9056"
        url: https://github.com/Infisical/infisical/pull/9056
        description: Apply the IRSA setting to temporary credentials
  - title: PKI certificate deletion keeps records
    description: Deleting a certificate, including through Certificate Cleanup, now
      keeps its record as Deleted, and the same certificate can't be imported
      again.
    action: Change automation that deletes and re-imports a certificate so it
      issues a new one.
    confidence: medium
    evidence:
      - type: file
        ref: backend/src/services/certificate/certificate-service.ts
        path: backend/src/services/certificate/certificate-service.ts
        description: Import refuses deleted certificates
      - type: file
        ref: docs/documentation/platform/pki/concepts/certificate-lifecycle.mdx
        path: docs/documentation/platform/pki/concepts/certificate-lifecycle.mdx
        description: Retirement section describes deleted certificates
      - type: pr
        ref: "#8828"
        url: https://github.com/Infisical/infisical/pull/8828
        description: Soft delete certificates
