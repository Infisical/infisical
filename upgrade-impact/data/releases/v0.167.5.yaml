deploymentNotes:
  - title: Agent Vault delegation rollout
    description: During a rolling deploy, older pods ignore onBehalfOf on any
      session they create or resolve, so it runs as the machine identity itself,
      with its own access and personal values, and skips the user checks.
    action: On multi-replica deployments, finish the rollout before setting up
      Agent Vault delegations.
    confidence: medium
    evidence:
      - type: pr
        ref: "#8773"
        url: https://github.com/Infisical/infisical/pull/8773
        description: Agent Vault sessions on a user's behalf
      - type: file
        ref: backend/src/db/migrations/20261019120000_agent-vault-delegations.ts
        path: backend/src/db/migrations/20261019120000_agent-vault-delegations.ts
  - title: TLS cert auth token binding rollout
    description: Older pods ignore token binding, so they accept bound tokens
      without a certificate and issue unbound ones that every pod accepts.
      Turning binding on revokes the identity's existing TLS cert auth tokens.
    action: Before turning on Bind Access Tokens to Client Certificate, finish the
      rollout and make the proxy set the client certificate header on every API
      request.
    confidence: medium
    evidence:
      - type: file
        ref: backend/src/services/identity-access-token/identity-access-token-fns.ts
        path: backend/src/services/identity-access-token/identity-access-token-fns.ts
        description: Tokens without a certificate claim skip the binding check
      - type: file
        ref: docs/documentation/platform/identities/tls-cert-auth.mdx
        path: docs/documentation/platform/identities/tls-cert-auth.mdx
        description: Proxy header requirement and token revocation
      - type: pr
        ref: "#9041"
        url: https://github.com/Infisical/infisical/pull/9041
        description: Certificate-bound access tokens
  - title: Platform rollback path
    description: The previous image boots on the upgraded schema but runs delegated
      Agent Vault sessions as the identity itself and ignores token binding.
      Reversing the migrations deletes Agent Vault delegations and skills.
    action: Take a database snapshot before upgrading. To roll back, restore it
      and run the previous image, as the upgrade guide describes.
    confidence: medium
    evidence:
      - type: url
        ref: Upgrading Infisical
        url: https://infisical.com/docs/self-hosting/guides/upgrading-infisical
        description: Restore a pre-upgrade snapshot to downgrade
      - type: file
        ref: backend/src/db/migrations/20261019120000_agent-vault-delegations.ts
        path: backend/src/db/migrations/20261019120000_agent-vault-delegations.ts
        description: down() drops delegations
