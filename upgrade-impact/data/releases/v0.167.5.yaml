deploymentNotes:
  - title: Agent Vault delegation rollout
    description: Until every pod runs v0.167.5, older pods drop onBehalfOf when
      minting and resolve delegated sessions as the machine identity's own, with
      its access and personal values.
    action: On multi-replica deployments, finish the rollout before setting up
      Agent Vault delegations.
    confidence: medium
    evidence:
      - type: pr
        ref: "#8773"
        url: https://github.com/Infisical/infisical/pull/8773
