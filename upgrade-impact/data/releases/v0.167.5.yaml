  - title: PKI certificate soft-delete migration
    description: Adds soft-delete columns to certificates under a 10-second lock
      timeout, then rebuilds indexes concurrently outside a transaction. A busy
      certificates table or a long-open transaction, such as a backup, can make
      startup fail on a lock timeout.
    action: If startup fails during migration, keep the previous version running
      and inspect migration logs before retrying.
