        path: backend/src/db/migrations/20261019120000_agent-vault-delegations.ts
  - title: TLS cert auth token binding rollout
    description: Older pods ignore token binding, so tokens they issue work without a
      certificate on every pod, and a rollback stops enforcing it. Turning binding
      on revokes the identity's existing TLS cert auth tokens.
    action: Finish the rollout before turning on Bind Access Tokens to Client
      Certificate, and set the client certificate header on every proxy location
      that forwards to the API.
    confidence: medium
    evidence:
