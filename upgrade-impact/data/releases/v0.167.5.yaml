summary: Agent Vault session logs in default storage now need a self-hosted
  license, and proxied services can no longer be created. Startup runs database
  migrations, and the certificates migration can fail on lock timeouts.
requiresDbMigration: true
breakingChanges:
  - title: Agent Vault session logs license
    description: Session logs in default storage (OBJECT_STORAGE_S3_*) now need a
      license that includes them. Without one, instances stop recording session
      logs and can't show existing ones, while external storage is unaffected.
    action: If you record session logs in default storage, get a license that
      includes them before upgrading. Offline license keys issued without session
      logs need replacing.
    confidence: high
    evidence:
      - type: pr
        ref: "#8990"
        url: https://github.com/Infisical/infisical/pull/8990
        description: Self-hosted session logs now need a license
