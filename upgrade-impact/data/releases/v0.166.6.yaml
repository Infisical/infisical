deploymentNotes:
  - title: Agent Vault variable rollback path
    description: The previous image reads and writes isSecret, so after the
      migration its Agent Vault variable requests fail until the column exists
      again. This also affects older pods during a rolling deploy. The
      migration's down() restores the column with every variable marked secret,
      so variables that were not secret before the upgrade stay secret.
    action: Roll out all Infisical pods together. Before rolling back, run this
      migration's down() from the newer image.
    confidence: medium
    evidence:
      - type: file
        ref: backend/src/db/migrations/20261009145434_drop-agent-vault-variable-is-secret.ts
        path: backend/src/db/migrations/20261009145434_drop-agent-vault-variable-is-secret.ts
        description: down() restores isSecret as true for all rows
