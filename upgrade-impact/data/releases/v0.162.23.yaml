deploymentNotes:
  - title: Gateway version for PKI sync post-sync commands
    description: PKI sync post-sync commands now accept 8192 characters, up from
      2048. A Gateway on Infisical CLI older than v0.43.124 still caps commands
      at 2048 characters and rejects the sync even though the form accepts the
      command.
    action: Upgrade the Gateway to Infisical CLI v0.43.124 or later before
      saving a post-sync command longer than 2048 characters. Existing commands
      keep working.
