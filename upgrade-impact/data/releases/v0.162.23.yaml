breakingChanges:
  - title: ACME and SCEP certificate profile defaults
    description: ACME and SCEP enrollment fills certificate profile defaults
      before policy validation. A CSR that omits a required key usage, which
      certbot and lego always do, now passes instead of failing with Missing
      required key usages. The CSR forwarded to external CAs is unchanged.
    action: If you relied on those rejections to block enrollment, remove the
      key usage defaults from the affected certificate profiles. Otherwise no
      manual action is required.
    confidence: high
