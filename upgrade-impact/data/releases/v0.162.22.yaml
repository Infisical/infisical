  - title: Audit reports org scope
    description: Adds nullable orgId to audit_reports, makes projectId nullable, and
      enforces exactly one scope with a check constraint that Postgres validates
      against every existing row as part of the same migration.
    action: No manual action required; Infisical runs this migration during startup.
      On a large audit_reports table, constraint validation locks the table until
      the scan finishes. Rolling this migration back manually deletes every
      org-scoped report (null projectId) before restoring the NOT NULL constraint.
    confidence: high
