breakingChanges:
  - title: Native integration creation disabled
    description: The POST /integration endpoint now always returns a 400 error,
      and createIntegration was removed from the integration service. Every
      request to create a new native integration fails immediately after
      upgrading, including calls from external automation. Existing
      integrations keep reading, updating, deleting, and syncing normally.
    action: Migrate any automation that creates native integrations to Secret
      Syncs before upgrading. Existing integrations require no changes.
