deploymentNotes:
  - title: Session log S3 bucket setup
    description: Default session log storage needs an S3 bucket, CORS for SITE_URL,
      lifecycle rules for retention tags, and IAM permissions for list, read,
      write, and tagging.
    action: Create the S3 bucket and apply the documented CORS, lifecycle, and IAM
      settings before enabling default session log storage.
