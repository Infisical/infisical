configChanges:
  - title: Session log default storage
    description: You can now enable instance-wide default storage for Agent Vault
      session logs with S3 settings. If you set only part of the S3
      configuration, backend startup fails.
    action: If you want default session log storage, set OBJECT_STORAGE_S3_BUCKET
      and OBJECT_STORAGE_S3_REGION together, plus optional prefix and
      credentials.
