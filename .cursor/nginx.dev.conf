# Cloud Agent dev reverse proxy: serves the Vite frontend and proxies /api to the
# backend on a single origin (http://localhost:8080), mirroring nginx/default.dev.conf
# but pointing at native localhost services instead of compose hostnames.
worker_processes 1;
error_log /tmp/cursor/nginx/error.log warn;
pid /tmp/cursor/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/cursor/nginx/access.log;
    client_body_temp_path /tmp/cursor/nginx/body;
    proxy_temp_path /tmp/cursor/nginx/proxy;
    fastcgi_temp_path /tmp/cursor/nginx/fastcgi;
    uwsgi_temp_path /tmp/cursor/nginx/uwsgi;
    scgi_temp_path /tmp/cursor/nginx/scgi;

    upstream api {
        server 127.0.0.1:4000;
    }
    upstream ui {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;

        large_client_header_buffers 8 128k;
        client_header_buffer_size 128k;

        location ~ ^/(api|secret-scanning/webhooks) {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Identity-Tls-Cert-Auth-Client-Cert "";
            client_max_body_size 25M;
            proxy_pass http://api;
            proxy_redirect off;
            proxy_cookie_path / "/; SameSite=strict";
        }

        location /runtime-ui-env.js {
            proxy_set_header Host $http_host;
            proxy_pass http://api;
            proxy_redirect off;
            proxy_cookie_path / "/; HttpOnly; SameSite=strict";
        }

        location /scep {
            proxy_set_header Host $http_host;
            proxy_pass http://api;
            proxy_redirect off;
        }

        location ~ /\.well-known {
            proxy_set_header Host $http_host;
            proxy_pass http://api;
            proxy_redirect off;
            proxy_cookie_path / "/; HttpOnly; SameSite=strict";
        }

        # Everything else: the Vite dev server (with HMR websocket support).
        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-NginX-Proxy true;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://ui;
            proxy_redirect off;
        }
    }
}
