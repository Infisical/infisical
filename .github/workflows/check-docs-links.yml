name: Check Docs Links

on:
  pull_request:
    paths:
      - "docs/**"

jobs:
  check-docs-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 Nov 14, 2025
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 Nov 14, 2025
        with:
          python-version: "3.12"

      - name: Run Mintlify broken-links
        working-directory: docs
        run: npx -y mint@latest broken-links --check-snippets --check-redirects

      - name: Run supplementary link check
        working-directory: docs
        run: python3 scripts/check-doc-links.py
