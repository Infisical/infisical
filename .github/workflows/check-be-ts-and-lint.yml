name: "Check Backend PR types and lint"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "backend/**"
      - "!backend/README.md"
      - "!backend/.*"
      - "backend/.eslintrc.js"
      - "backend/.npmrc"
      - ".npmrc"
      - ".nvmrc"
      - "build-versions.env"
      - "scripts/check-node-toolchain.mjs"
      - ".github/actions/setup-node-toolchain/**"
      - ".github/workflows/check-be-ts-and-lint.yml"

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 🔧 Setup Node toolchain
        id: setup-node
        uses: ./.github/actions/setup-node-toolchain
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ steps.setup-node.outputs.npm-version }}-${{ hashFiles('backend/package-lock.json', 'backend/.npmrc', '.npmrc') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backend
      - name: 📦 Cache tsbuildinfo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/.cache/tsconfig.tsbuildinfo
          key: backend-tsbuildinfo-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            backend-tsbuildinfo-${{ github.ref }}-
            backend-tsbuildinfo-
      - name: Run type check
        run: npm run type:check
        working-directory: backend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 🔧 Setup Node toolchain
        id: setup-node
        uses: ./.github/actions/setup-node-toolchain
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ steps.setup-node.outputs.npm-version }}-${{ hashFiles('backend/package-lock.json', 'backend/.npmrc', '.npmrc') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backend
      - name: Run lint check
        run: npm run lint
        working-directory: backend
