name: Release Infisical Core Helm chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - helm-charts/infisical-standalone-postgres/Chart.yaml

concurrency:
  group: helm-release-infisical-core
  cancel-in-progress: false

jobs:
  # A published chart version must never change, so a version already in the registry is
  # never pushed again. This also skips commits that touch Chart.yaml without a new version.
  check-version:
    name: Check chart version is unpublished
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.0

      - name: Look up chart version in the registry
        id: check
        run: |
          set -euo pipefail
          VERSION="$(yq '.version' helm-charts/infisical-standalone-postgres/Chart.yaml)"

          if ERR="$(helm show chart oci://helm.oci.cloudsmith.io/infisical/helm-charts/infisical-standalone --version "$VERSION" 2>&1 >/dev/null)"; then
            echo "::notice::Chart $VERSION is already published. Bump the chart version to release changes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$ERR" | grep -q ': not found$'; then
            echo "Chart $VERSION is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check whether chart $VERSION is published: $ERR"
            exit 1
          fi

  test-helm:
    name: Test Helm Chart
    needs: [check-version]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Add Helm repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0
        with:
          yamale_version: "6.0.0"

      - name: Run chart-testing (lint)
        # The version bump is checked on the PR. Here the code is already on main, which ct
        # compares against, so the check would always fail; check-version guards publishing.
        run: ct lint --config ct.yaml --charts helm-charts/infisical-standalone-postgres --check-version-increment=false

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0

      - name: Create namespace
        run: kubectl create namespace infisical-standalone-postgres

      - name: Create Infisical secrets
        run: |
          kubectl create secret generic infisical-secrets \
            --namespace infisical-standalone-postgres \
            --from-literal=AUTH_SECRET=6c1fe4e407b8911c104518103505b218 \
            --from-literal=ENCRYPTION_KEY=6c1fe4e407b8911c104518103505b218 \
            --from-literal=SITE_URL=http://localhost:8080

      - name: Run chart-testing (install)
        run: |
          ct install \
            --config ct.yaml \
            --charts helm-charts/infisical-standalone-postgres \
            --helm-extra-args="--timeout=300s" \
            --helm-extra-set-args="--set ingress.nginx.enabled=false --set infisical.replicaCount=1 --set-string infisical.extraEnv[0].name=TELEMETRY_ENABLED --set-string infisical.extraEnv[0].value=false" \
            --namespace infisical-standalone-postgres

  freeze-check:
    name: Release freeze check
    needs: [test-helm]
    uses: ./.github/workflows/release-freeze-check.yml
    with:
      freeze: ${{ vars.DEPLOY_FREEZE }}

  release:
    needs: [freeze-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2 (outdated — consider upgrading to v4)
      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3 latest
        with:
          version: v3.10.0
      - name: Build and push helm package to Cloudsmith
        run: cd helm-charts && sh upload-infisical-core-helm-cloudsmith.sh
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
