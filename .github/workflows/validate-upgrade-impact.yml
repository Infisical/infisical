name: Validate upgrade impact data

on:
  pull_request:
    paths:
      - "upgrade-impact/**"
      - ".npmrc"
      - ".nvmrc"
      - "build-versions.env"
      - "scripts/check-node-toolchain.mjs"
      - ".github/actions/setup-node-toolchain/**"
      - ".github/workflows/validate-upgrade-impact.yml"
      - ".github/workflows/generate-upgrade-impact.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: ./.github/actions/setup-node-toolchain
        with:
          cache: npm
          cache-dependency-path: upgrade-impact/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: upgrade-impact

      - name: Type check
        run: npm run type:check
        working-directory: upgrade-impact

      - name: Test upgrade impact tooling
        run: npm test
        working-directory: upgrade-impact

      - name: Validate upgrade impact data
        run: npm run validate
        working-directory: upgrade-impact
