name: Validate upgrade impact data

on:
  pull_request:
    paths:
      - "upgrade-impact/**"
      - ".github/workflows/validate-upgrade-impact.yml"
      - ".github/workflows/generate-upgrade-impact.yml"
      - ".nvmrc"

env:
  NPM_VERSION: "11.19.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
        working-directory: ${{ runner.temp }}

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ env.NPM_VERSION }}-${{ hashFiles('upgrade-impact/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ env.NPM_VERSION }}-

      - name: Install dependencies
        run: npm ci
        working-directory: upgrade-impact

      - name: Type check
        run: npm run type:check
        working-directory: upgrade-impact

      - name: Test upgrade impact tooling
        run: npm test
        working-directory: upgrade-impact

      - name: Validate upgrade impact data
        run: npm run validate
        working-directory: upgrade-impact
