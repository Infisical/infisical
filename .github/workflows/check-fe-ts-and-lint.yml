name: Check Frontend Type and Lint check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "frontend/**"
      - "!frontend/README.md"
      - "!frontend/.*"
      - "frontend/.eslintrc.js"
      - "frontend/.npmrc"
      - ".npmrc"
      - ".nvmrc"
      - "build-versions.env"
      - "scripts/check-node-toolchain.mjs"
      - ".github/actions/setup-node-toolchain/**"
      - ".github/workflows/check-fe-ts-and-lint.yml"

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 🔧 Setup Node toolchain
        id: setup-node
        uses: ./.github/actions/setup-node-toolchain
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ steps.setup-node.outputs.npm-version }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.npmrc', '.npmrc') }}
      - name: 📦 Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: frontend
      - name: 📦 Cache tsbuildinfo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/.cache/tsconfig.app.tsbuildinfo
          key: frontend-tsbuildinfo-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            frontend-tsbuildinfo-${{ github.ref }}-
            frontend-tsbuildinfo-
      - name: 🏗️ Run Type check
        run: npm run type:check
        working-directory: frontend
      - name: 🧪 Run unit tests
        run: npm test
        working-directory: frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 🔧 Setup Node toolchain
        id: setup-node
        uses: ./.github/actions/setup-node-toolchain
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ steps.setup-node.outputs.npm-version }}-${{ hashFiles('frontend/package-lock.json', 'frontend/.npmrc', '.npmrc') }}
      - name: 📦 Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: frontend
      - name: 🏗️ Run Lint check
        run: npm run lint
        working-directory: frontend
