name: "Security Review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Security Review
    # Fork PRs get no secrets, and the scanner is not hardened against prompt injection from untrusted code
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Runs the scanner's audit script directly; its action.yml sets up Node 18, which resolves to a
      # Claude Code release too old for current models, and reports a passing check when the scan errors
      - name: ☁️ Checkout scanner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: anthropics/claude-code-security-review
          ref: 0c6a49f1fa56a1d472575da86a94dbc1edb78eda
          path: scanner
          persist-credentials: false

      - name: 🔧 Setup Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"

      - name: 🔧 Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: 📦 Install scanner dependencies
        run: |
          # npm 11 skips install scripts unless allowed, and Claude Code's postinstall is what links its native binary
          npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code@2.1.296
          claude --version
          pip install anthropic==1.13.0 requests==2.34.2
          # The scanner probes the API with a retired model, which silently turns off false-positive filtering,
          # and relies on implicit print mode, which current Claude Code only enables with -p
          sed -i 's/claude-3-5-haiku-20241022/claude-haiku-5-5/' scanner/claudecode/claude_api_client.py
          sed -i "s/^\( *\)'claude',$/\1'claude', '-p',/" scanner/claudecode/github_action_audit.py
          if grep -q "claude-3-5-haiku" scanner/claudecode/claude_api_client.py || ! grep -q "'claude', '-p'," scanner/claudecode/github_action_audit.py; then
            echo "::error::Scanner patches did not apply"
            exit 1
          fi

      - name: 🔍 Run security review
        working-directory: scanner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-opus-5-5
          ENABLE_CLAUDE_FILTERING: "true"
          EXCLUDE_DIRECTORIES: docs
          CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ github.workspace }}/pr/.github/security-review/scan-instructions.txt
          FALSE_POSITIVE_FILTERING_INSTRUCTIONS: ${{ github.workspace }}/pr/.github/security-review/false-positive-filtering.txt
          REPO_PATH: ${{ github.workspace }}/pr
          PYTHONPATH: ${{ github.workspace }}/scanner
          # Keeps the pinned CLI from self-updating and turns off its telemetry and error reporting
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: python -u claudecode/github_action_audit.py > "$RUNNER_TEMP/results.json" 2> "$RUNNER_TEMP/scan.log" || true

      - name: 🚦 Check findings
        run: |
          results="$RUNNER_TEMP/results.json"
          if ! jq -e '.findings | type == "array"' "$results" > /dev/null 2>&1; then
            cat "$RUNNER_TEMP/scan.log" 2>/dev/null || true
            reason=$(jq -r '(.error // "no results") | split("\n")[0]' "$results" 2>/dev/null || echo "no results")
            echo "::error::Security review did not complete: $reason"
            exit 1
          fi

          if grep -q -e "Claude API validation failed" -e "Failed to initialize Claude client" "$RUNNER_TEMP/scan.log"; then
            echo "::warning::False-positive filtering was unavailable, so findings were not filtered a second time"
          fi

          # Locations and categories only: this repo is public, so exploit write-ups stay out of logs and comments.
          # Category is model-written, so it is cut down to a short token before it reaches the summary.
          {
            echo "## Security review"
            echo
            jq -r '
              if (.findings | length) == 0 then "No findings."
              else
                "| Severity | Category | Location |",
                "|---|---|---|",
                (.findings[] | "| \(.severity // "unknown" | tostring | ascii_upcase | gsub("[^A-Z]"; "")) | \(.category // "unknown" | tostring | gsub("[^A-Za-z0-9_-]"; "_") | .[0:40]) | `\(.file // "?"):\(.line // "?")` |")
              end' "$results"
          } >> "$GITHUB_STEP_SUMMARY"

          blocking=$(jq '[.findings[] | select(.severity // "" | ascii_upcase | . == "HIGH" or . == "MEDIUM")] | length' "$results")
          if [ "$blocking" -gt 0 ]; then
            echo "::error::Security review found $blocking HIGH or MEDIUM finding(s). Locations are in the job summary."
            exit 1
          fi
