name: "Publish FIPS test toolchain image"

# Builds backend/Dockerfile.fips-toolchain and publishes it to GHCR so that
# run-backend-tests.yml does not have to compile two OpenSSL trees on every PR.
#
# Tagged with the content hash of the toolchain Dockerfile: run-backend-tests.yml
# computes the same hash and pulls that exact tag, falling back to building from
# source when a PR changes the toolchain and the new tag isn't published yet.
#
# Built on native runners per architecture rather than under QEMU: emulated arm64
# OpenSSL compilation takes hours. arm64 is published because docker-compose.dev.yml
# uses this image for local dev on Apple Silicon.

on:
  push:
    branches:
      - main
    paths:
      - "backend/Dockerfile.fips-toolchain"
      - ".github/workflows/publish-fips-toolchain.yml"
  workflow_dispatch:

concurrency:
  group: publish-fips-toolchain
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref and tag
        id: meta
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/backend-fips-toolchain" >> "$GITHUB_OUTPUT"
          echo "tag=${{ hashFiles('backend/Dockerfile.fips-toolchain') }}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile.fips-toolchain
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}

  manifest:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/backend-fips-toolchain"
          TAG="${{ hashFiles('backend/Dockerfile.fips-toolchain') }}"
          for target in "$TAG" main; do
            docker buildx imagetools create \
              -t "${IMAGE}:${target}" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          done
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
