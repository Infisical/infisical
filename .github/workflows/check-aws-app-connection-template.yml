name: "Check AWS app connection template"

on:
    pull_request:
        types: [opened, synchronize]
        paths:
            - "cloudformation/aws-app-connection/**"
            - "docs/snippets/app-connections/aws/use-cases.jsx"
            - ".github/workflows/check-aws-app-connection-template.yml"

jobs:
    template:
        name: Template is current and valid
        runs-on: ubuntu-latest
        steps:
            - name: ☁️ Checkout source
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
            - name: Committed template matches generated output
              run: node cloudformation/aws-app-connection/generate-template.mjs --check
            - name: Generator tests
              run: node --test cloudformation/aws-app-connection/generate-template.test.mjs
            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"
            - name: Lint template with cfn-lint
              run: |
                  pip install cfn-lint
                  cfn-lint cloudformation/aws-app-connection/infisical-aws-app-connection.yaml
