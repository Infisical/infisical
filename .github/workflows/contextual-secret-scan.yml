name: Contextual Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base:
        description: Base revision to compare against the selected workflow branch
        required: true
        type: string
      mode:
        description: Monitor reports findings; enforce blocks every finding
        default: monitor
        type: choice
        options: [monitor, enforce]

permissions:
  contents: read

concurrency:
  group: contextual-secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scanner-tests:
    name: Contextual scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies and scanner
        working-directory: tools/contextual-secret-scan
        run: |
          npm ci --ignore-scripts
          bash install-gitleaks.sh .bin
      - name: Run lint and offline regression tests
        working-directory: tools/contextual-secret-scan
        run: npm run check && npm test

  scan:
    name: Contextual secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted scanner from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out source as data, not executable code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Select trusted tooling or credential-free bootstrap
        id: tooling
        shell: bash
        run: |
          if [[ -f trusted/tools/contextual-secret-scan/scan.mjs ]]; then
            echo "directory=trusted/tools/contextual-secret-scan" >> "$GITHUB_OUTPUT"
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "directory=source/tools/contextual-secret-scan" >> "$GITHUB_OUTPUT"
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap run: classification is disabled until the scanner lands on the default branch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install scanner tooling without lifecycle scripts
        working-directory: ${{ steps.tooling.outputs.directory }}
        run: |
          npm ci --ignore-scripts
          bash install-gitleaks.sh .bin
      - name: Scan with trusted tooling
        if: steps.tooling.outputs.trusted == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ vars.CONTEXTUAL_SECRET_SCAN_AI_ENABLED == 'true' && secrets.AI_GATEWAY_API_KEY || '' }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ inputs.mode || vars.CONTEXTUAL_SECRET_SCAN_MODE || 'monitor' }}
        run: |
          node trusted/tools/contextual-secret-scan/scan.mjs \
            --repo source --base "$BASE" --head "$HEAD" --mode "$MODE" \
            --gitleaks "$GITHUB_WORKSPACE/trusted/tools/contextual-secret-scan/.bin/gitleaks" \
            --output "$RUNNER_TEMP/contextual-secret-scan"
      - name: Bootstrap scan without external credentials
        if: steps.tooling.outputs.trusted != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node source/tools/contextual-secret-scan/scan.mjs \
            --repo source --base "$BASE" --head "$HEAD" --mode monitor \
            --gitleaks "$GITHUB_WORKSPACE/source/tools/contextual-secret-scan/.bin/gitleaks" \
            --output "$RUNNER_TEMP/contextual-secret-scan"
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contextual-secret-scan
          path: ${{ runner.temp }}/contextual-secret-scan/
          if-no-files-found: ignore
          retention-days: 7
