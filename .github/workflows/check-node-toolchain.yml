name: Check Node toolchain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-toolchain:
    name: Node toolchain policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up and verify Node toolchain
        uses: ./.github/actions/setup-node-toolchain
      - name: Test Node toolchain policy
        run: node --test scripts/node-toolchain.test.mjs
