name: "Check Dockerfile pins"

on:
    pull_request:
        types: [opened, synchronize]
        paths:
            - "**/Dockerfile*"

jobs:
    cli-pin:
        name: Infisical CLI pin is consistent
        runs-on: ubuntu-latest
        steps:
            - name: ☁️ Checkout source
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            # Five Dockerfiles install the CLI and each carries its own pin, so they
            # drift silently. Docker has no include, so this asserts instead.
            - name: Every image pins the same CLI version
              run: |
                  set -euo pipefail
                  pins="$(grep -rhoE 'infisical=[0-9]+\.[0-9]+\.[0-9]+' --include='Dockerfile*' . | sort -u)"
                  count="$(printf '%s\n' "$pins" | grep -c . || true)"
                  if [ "$count" -ne 1 ]; then
                    echo "::error::Dockerfiles disagree on the Infisical CLI pin"
                    grep -rnE 'infisical=[0-9]+\.[0-9]+\.[0-9]+' --include='Dockerfile*' .
                    exit 1
                  fi
                  echo "All Dockerfiles pin ${pins}"
