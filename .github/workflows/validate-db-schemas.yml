name: "Validate DB schemas"

on:
    pull_request:
        types: [opened, synchronize]
        paths:
            - "backend/**"
            - ".nvmrc"

    workflow_call:

env:
    NPM_VERSION: "11.19.0"

jobs:
    validate-db-schemas:
        name: Validate DB schemas
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            NODE_OPTIONS: "--max-old-space-size=8192"
            REDIS_URL: redis://172.17.0.1:6379
            DB_CONNECTION_URI: postgres://infisical:infisical@172.17.0.1:5432/infisical?sslmode=disable
            AUTH_SECRET: something-random
            ENCRYPTION_KEY: 4bnfe4e407b8921c104518903515b218
        steps:
            - name: ☁️ Checkout source
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025
              with:
                  fetch-depth: 0
            - uses: KengoTODA/actions-setup-docker-compose@477353946803dd64eaa44008b865b6bfc88cab4e # v1.2.4
              if: ${{ env.ACT }}
              name: Install `docker compose` for local simulations
              with:
                  version: "2.14.2"
            - name: 🔧 Setup Node from .nvmrc
              id: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"

            - name: Setup npm
              run: |
                  npm install --global "npm@${NPM_VERSION}"
                  test "$(npm --version)" = "${NPM_VERSION}"
              working-directory: ${{ runner.temp }}

            - name: Cache npm
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ env.NPM_VERSION }}-${{ hashFiles('backend/package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-npm${{ env.NPM_VERSION }}-

            - name: Start PostgreSQL and Redis
              run: touch .env && docker compose -f docker-compose.dev.yml up -d db redis
            - name: Install dependencies
              run: npm ci
              working-directory: backend

            - name: Apply migrations
              run: npm run migration:latest-dev
              working-directory: backend

            - name: Run schema generation
              run: npm run generate:schema
              working-directory: backend

            - name: Check for schema changes
              run: |
                  if ! git diff --exit-code --quiet src/db/schemas; then
                    echo "❌ Generated schemas differ from committed schemas!"
                    echo "Run 'npm run generate:schema' locally and commit the changes."
                    git diff src/db/schemas
                    exit 1
                  fi
                  echo "✅ Schemas are up to date"
              working-directory: backend

            - name: Cleanup
              if: always()
              run: |
                  docker compose -f "docker-compose.dev.yml" down
