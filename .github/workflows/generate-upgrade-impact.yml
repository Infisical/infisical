name: Generate upgrade impact data

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to analyze, for example v0.159.23"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Stable release tag to analyze, for example v0.159.23"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: release
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping non-stable release tag: $TAG_NAME"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Look for an existing upgrade impact PR
        id: existing
        if: steps.release.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          PR_NUMBER="$(gh pr list --base main --head "chore/upgrade-impact-${TAG_NAME}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            echo "Pull request #${PR_NUMBER} already covers ${TAG_NAME}; leaving its data untouched."
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 Nov 14, 2025
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        uses: ./.github/actions/setup-node-toolchain
        with:
          cache: npm
          cache-dependency-path: upgrade-impact/package-lock.json

      - name: Install dependencies
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        run: npm ci
        working-directory: upgrade-impact

      - name: Type check
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        run: npm run type:check
        working-directory: upgrade-impact

      - name: Test upgrade impact tooling
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        run: npm test
        working-directory: upgrade-impact

      - name: Generate upgrade impact data
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        run: npm run generate -- --tag "${{ steps.release.outputs.tag }}"
        working-directory: upgrade-impact
        env:
          UPGRADE_TOOL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate upgrade impact data
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        run: npm run validate
        working-directory: upgrade-impact

      - name: Open upgrade impact PR
        id: pr
        if: steps.release.outputs.stable == 'true' && steps.existing.outputs.pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          BRANCH_NAME="chore/upgrade-impact-${TAG_NAME}"
          PR_TITLE="chore: add upgrade impact for ${TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"
          git add upgrade-impact/data

          if git diff --cached --quiet; then
            echo "No upgrade impact data changes detected."
            exit 0
          fi

          git commit -m "$PR_TITLE"

          REMOTE_SHA="$(git ls-remote --heads origin "$BRANCH_NAME" | cut -f1)"
          if [ -z "$REMOTE_SHA" ]; then
            git push origin "$BRANCH_NAME"
          else
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:${REMOTE_SHA}" origin "$BRANCH_NAME"
          fi

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "Generated self-hosted upgrade impact data for \`${TAG_NAME}\`.

          Review the generated YAML for self-hosted upgrade accuracy before merging.

          ## Type

          - [ ] Fix
          - [ ] Feature
          - [ ] Improvement
          - [ ] Breaking
          - [ ] Docs
          - [x] Chore")"

          echo "Opened $PR_URL"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Request review from the release author
        if: steps.release.outputs.stable == 'true' && (steps.existing.outputs.pr != '' || steps.pr.outputs.number != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          PR_NUMBER: ${{ steps.existing.outputs.pr || steps.pr.outputs.number }}
        run: |
          RELEASE_AUTHOR="$(gh release view "$TAG_NAME" --json author --jq .author.login 2>/dev/null || true)"

          if [ -z "$RELEASE_AUTHOR" ]; then
            echo "::error::Could not resolve the author of release ${TAG_NAME}. Pull request #${PR_NUMBER} is open with nobody assigned to review it."
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            --method POST \
            --raw-field "reviewers[]=${RELEASE_AUTHOR}" \
            --silent; then
            echo "::error::Could not request review from ${RELEASE_AUTHOR}. Pull request #${PR_NUMBER} is open with nobody assigned to review it."
            exit 1
          fi

          echo "Requested review from release author: $RELEASE_AUTHOR"

  notify:
    name: Notify incident.io if the upgrade impact PR is blocked
    runs-on: ubuntu-latest
    needs: [generate]
    if: always() && needs.generate.result == 'failure'
    steps:
      - name: Send blocked alert to incident.io
        env:
          ALERT_URL: ${{ secrets.INCIDENT_IO_DEPLOY_ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.INCIDENT_IO_DEPLOY_ALERT_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Guard against a misconfigured/rotated secret redirecting the POST (and the
          # bearer token) to an unintended host: only allow the incident.io API origin.
          case "$ALERT_URL" in
            https://api.incident.io/*) ;;
            *)
              echo "::error::ALERT_URL does not point at https://api.incident.io/ — refusing to send alert."
              exit 1
              ;;
          esac

          jq -n \
            --arg title "[${REPO}] Upgrade impact PR blocked for ${RELEASE_TAG}" \
            --arg description "Self-hosted upgrade impact data for ${RELEASE_TAG} was not published, or its pull request has no reviewer." \
            --arg dedup "upgrade-impact-${RELEASE_TAG}" \
            --arg url "$RUN_URL" \
            --arg tag "${RELEASE_TAG:-unknown}" \
            --arg actor "$ACTOR" \
            '{
              title: $title,
              description: $description,
              deduplication_key: $dedup,
              status: "firing",
              source_url: $url,
              metadata: { release_tag: $tag, actor: $actor }
            }' \
          | curl -sS --fail-with-body --connect-timeout 10 --max-time 30 -X POST "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
