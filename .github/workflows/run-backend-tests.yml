name: "Run backend tests"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "backend/**"
      - "!backend/README.md"
      - "!backend/.*"
      - "backend/.eslintrc.js"
  workflow_call:

concurrency:
  group: run-backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-be-pr:
    name: Run integration test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: KengoTODA/actions-setup-docker-compose@477353946803dd64eaa44008b865b6bfc88cab4e # v1.2.4
        if: ${{ env.ACT }}
        name: Install `docker compose` for local simulations
        with:
          version: "2.14.2"
      - name: 🔧 Setup Node 22
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backend
      - name: Start postgres and redis
        run: touch .env && docker compose -f docker-compose.dev.yml up -d db redis
      - name: Start Secret Rotation testing databases
        run: docker compose -f docker-compose.e2e-dbs.yml up -d
      - name: Run unit test
        run: npm run test:unit
        working-directory: backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve FIPS toolchain image
        id: toolchain
        run: |
          set -euo pipefail
          # Lowercased: GHCR rejects uppercase repository names and the owner is "Infisical".
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/backend-fips-toolchain"
          TAG="${{ hashFiles('backend/Dockerfile.fips-toolchain') }}"
          if docker pull --quiet "$IMAGE:$TAG"; then
            echo "Using published toolchain $IMAGE:$TAG"
            echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No published toolchain for $TAG (this PR changes backend/Dockerfile.fips-toolchain); building from source."
            docker buildx build --load \
              -f backend/Dockerfile.fips-toolchain \
              -t "backend-fips-toolchain:$TAG" \
              backend
            echo "image=backend-fips-toolchain:$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Build FIPS test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile.dev.fips
          load: true
          tags: infisical-backend-fips:latest
          build-args: |
            TOOLCHAIN_IMAGE=${{ steps.toolchain.outputs.image }}
      - name: Report disk space
        if: always()
        run: df -h /
      - name: Wait for Secret Rotation testing databases
        run: docker compose -f docker-compose.e2e-dbs.yml up -d --wait --wait-timeout 300
      - name: Run integration test
        run: |
          docker run --rm --network host \
            -e DB_CONNECTION_URI="postgres://infisical:infisical@localhost:5432/infisical?sslmode=disable" \
            -e REDIS_URL="redis://localhost:6379" \
            -e AUTH_SECRET="something-random" \
            -e ENCRYPTION_KEY="p5e5k2j3+HIErjm02dzSrlhXc1xhdgoWvC6pox410rE=" \
            -e NODE_ENV="test" \
            -e NODE_OPTIONS="--force-fips" \
            -e TELEMETRY_ENABLED="false" \
            -e E2E_TEST_ORACLE_DB_19_HOST="${{ secrets.E2E_TEST_ORACLE_DB_19_HOST }}" \
            -e E2E_TEST_ORACLE_DB_19_USERNAME="${{ secrets.E2E_TEST_ORACLE_DB_19_USERNAME }}" \
            -e E2E_TEST_ORACLE_DB_19_PASSWORD="${{ secrets.E2E_TEST_ORACLE_DB_19_PASSWORD }}" \
            -e E2E_TEST_ORACLE_DB_19_DATABASE="${{ secrets.E2E_TEST_ORACLE_DB_19_DATABASE }}" \
            infisical-backend-fips:latest \
            npm run test:e2e
      - name: cleanup
        if: always()
        run: |
          docker compose -f "docker-compose.dev.yml" down
          docker compose -f "docker-compose.e2e-dbs.yml" down
