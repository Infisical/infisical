name: "Run backend tests"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "backend/**"
      - "!backend/README.md"
      - "!backend/.*"
      - "backend/.eslintrc.js"
      - "build-versions.env"
  workflow_call:

concurrency:
  group: run-backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-be-pr:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true

      - name: ☁️ Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: KengoTODA/actions-setup-docker-compose@477353946803dd64eaa44008b865b6bfc88cab4e # v1.2.4
        if: ${{ env.ACT }}
        name: Install `docker compose` for local simulations
        with:
          version: "2.14.2"
      - name: 🔧 Setup Node 22
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: 📦 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: backend-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backend
      - name: Start Secret Rotation testing databases
        run: docker compose -f docker-compose.e2e-dbs.yml up -d
      - name: Run unit tests
        run: npm run test:unit
        working-directory: backend
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve FIPS toolchain image
        run: |
          set -euo pipefail
          # Lowercased: GHCR rejects uppercase repository names and the owner is "Infisical".
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/backend-fips-toolchain"
          TAG="${{ hashFiles('backend/Dockerfile.fips-toolchain', 'build-versions.env') }}"
          if docker pull --quiet "$IMAGE:$TAG"; then
            echo "Using published toolchain $IMAGE:$TAG"
            TOOLCHAIN="$IMAGE:$TAG"
          else
            echo "::notice::No published toolchain for $TAG (this PR changes backend/Dockerfile.fips-toolchain or build-versions.env); building from source."
            TOOLCHAIN="backend-fips-toolchain:$TAG"
            set -a; . ./build-versions.env; set +a
            docker build \
              -f backend/Dockerfile.fips-toolchain \
              --build-arg "INFISICAL_CLI_VERSION=$INFISICAL_CLI_VERSION" \
              -t "$TOOLCHAIN" \
              backend
          fi
          # Carried to the next step, which builds the app image through compose so the build
          # arguments and image name live in docker-compose.test.yml rather than here.
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Report disk space
        if: always()
        run: df -h /
      - name: Wait for Secret Rotation testing databases
        run: docker compose -f docker-compose.e2e-dbs.yml up -d --wait --wait-timeout 300
      # The same command a developer runs. The rotation databases above share the test stack's
      # compose project, so the suite reaches them by service name and CI needs no networking of
      # its own. Connection strings, mounts and the image build all live in the compose files.
      - name: Run end-to-end tests
        run: make test-api-e2e
        env:
          E2E_TEST_ORACLE_DB_19_HOST: ${{ secrets.E2E_TEST_ORACLE_DB_19_HOST }}
          E2E_TEST_ORACLE_DB_19_USERNAME: ${{ secrets.E2E_TEST_ORACLE_DB_19_USERNAME }}
          E2E_TEST_ORACLE_DB_19_PASSWORD: ${{ secrets.E2E_TEST_ORACLE_DB_19_PASSWORD }}
          E2E_TEST_ORACLE_DB_19_DATABASE: ${{ secrets.E2E_TEST_ORACLE_DB_19_DATABASE }}
      - name: cleanup
        if: always()
        run: |
          make down-test-suite-containers
