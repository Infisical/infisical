name: "Generate OpenAPI spec"
description: "Generates the public OpenAPI spec from a checkout's backend source and writes it to a file with the keys sorted for determinism."

inputs:
  source-path:
    description: "Path to the repository checkout to generate from."
    required: false
    default: "."
  output:
    description: "Path to write the normalized OpenAPI spec to."
    required: true
  write-cache:
    description: >-
      Whether to save the node_modules cache on a miss. Leave this off outside the default branch:
      a cache a PR writes is readable only by that PR, so it does nothing for anyone else while
      still consuming the repository's cache quota and evicting the entries on main that every PR
      reads from.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Node
      id: setup-node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "26"

    - name: Restore node_modules
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.source-path }}/backend/node_modules
        key: openapi-node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles(format('{0}/backend/package-lock.json', inputs.source-path), format('{0}/backend/package.json', inputs.source-path)) }}

    - name: Install dependencies
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.source-path }}/backend
      run: npm ci

    - name: Save node_modules
      if: steps.restore.outputs.cache-hit != 'true' && inputs.write-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.source-path }}/backend/node_modules
        key: ${{ steps.restore.outputs.cache-primary-key }}

    - name: Generate the spec
      shell: bash
      working-directory: ${{ inputs.source-path }}/backend
      run: |
        out_dir="$(mktemp -d)"
        npm run generate:openapi -- --out "$out_dir"
        gunzip -c "$out_dir/openapi.json.gz" > "$RUNNER_TEMP/raw-spec.json"

    - name: Dump the spec
      shell: bash
      run: |
        mkdir -p "$(dirname "${{ inputs.output }}")"

        # Sorting object keys keeps the bytes stable across runs, so a cached baseline
        # and a freshly built one are byte-identical for the same source tree.
        python3 -c '
        import json, sys
        spec = json.load(open(sys.argv[1]))
        json.dump(spec, open(sys.argv[2], "w"), sort_keys=True, separators=(",", ":"))
        ' "$RUNNER_TEMP/raw-spec.json" "${{ inputs.output }}"

        echo "Wrote $(du -h "${{ inputs.output }}" | cut -f1) to ${{ inputs.output }}"
