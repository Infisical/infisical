name: "Set up Node toolchain"
description: "Install and verify the repository's pinned Node.js and npm versions."

inputs:
  cache:
    description: "Set to npm to cache package downloads after installing the pinned npm."
    required: false
    default: ""
  cache-dependency-path:
    description: "Lockfile path used for the npm download cache key."
    required: false
    default: ""

outputs:
  node-version:
    description: "The installed Node.js version."
    value: ${{ steps.node.outputs.node-version }}
  npm-version:
    description: "The installed npm version."
    value: ${{ steps.npm.outputs.npm-version }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      id: node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    - name: Install pinned npm
      id: npm
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        NPM_VERSION="$(sed -n 's/^NPM_VERSION=//p' build-versions.env)"
        if [[ ! "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::build-versions.env must declare an exact NPM_VERSION."
          exit 1
        fi
        npm install --global "npm@$NPM_VERSION"
        echo "npm-version=$(npm --version)" >> "$GITHUB_OUTPUT"
        echo "cache-path=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    - name: Verify Node toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node scripts/check-node-toolchain.mjs

    - name: Cache npm downloads
      if: inputs.cache == 'npm'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.npm.outputs.cache-path }}
        key: npm-downloads-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-npm${{ steps.npm.outputs.npm-version }}-${{ hashFiles(inputs.cache-dependency-path) }}
